name: TrickyBox
on:
  push:
    branches: [ "integrity-box" ]
    paths-ignore:
      - '**.md'
      - '.github/**'
      - '!.github/workflows/**'
      - 'update.json'
  pull_request:
    branches: [ "integrity-box" ]
    paths-ignore:
      - '**.md'
      - '.github/**'
      - '!.github/workflows/**'
      - 'update.json'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    outputs:
      releaseName: ${{ steps.prepareArtifact.outputs.releaseName }}
      debugName: ${{ steps.prepareArtifact.outputs.debugName }}

    steps:
      - name: Check out
        uses: actions/checkout@v7
        with:
          submodules: "recursive"
          fetch-depth: 0

      - name: Setup Java
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 26

      - name: Set up ccache
        uses: hendrikmuhs/ccache-action@v1.2
        with:
          key: ccache-${{ runner.os }}-${{ github.ref_name }}
          restore-keys: |
            ccache-${{ runner.os }}-${{ github.ref_name }}
            ccache-${{ runner.os }}-
            ccache-

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6.4.1

      - name: Build with Gradle
        run: ./gradlew --parallel assembleRelease assembleDebug lintRelease --stacktrace

      - name: Prepare artifact
        id: prepareArtifact
        shell: bash
        run: |
          set -e
          RELEASE_FILE=$(find out -type f -name "*Release*.zip" ! -name "TrickyBox-*" -print -quit)
          DEBUG_FILE=$(find out -type f -name "*Debug*.zip" ! -name "TrickyBox-*" -print -quit)

          if [[ -z "$RELEASE_FILE" || -z "$DEBUG_FILE" ]]; then
            echo "::error::Could not find release or debug files in out/"
            ls -la out/ || echo "out/ directory does not exist"
            exit 1
          fi

          RUN_NAME="TrickyBox-${GITHUB_RUN_NUMBER}"
          RELEASE_OUTPUT="out/${RUN_NAME} Release.zip"
          DEBUG_OUTPUT="out/${RUN_NAME} Debug.zip"

          mv "$RELEASE_FILE" "$RELEASE_OUTPUT"
          mv "$DEBUG_FILE" "$DEBUG_OUTPUT"

          # Universal artifact validation
          for ZIP in "$RELEASE_OUTPUT" "$DEBUG_OUTPUT"; do
            DEX_COUNT=$(unzip -Z1 "$ZIP" | grep -xc "attestation.dex" || true)
            APK_COUNT=$(unzip -Z1 "$ZIP" | grep -xc "attestation.apk" || true)

            if [[ "$DEX_COUNT" -eq 0 && "$APK_COUNT" -eq 0 ]]; then
              echo "::error::$(basename "$ZIP") contains neither attestation.dex nor attestation.apk"
              exit 1
            fi

            if [[ "$DEX_COUNT" -gt 0 && "$APK_COUNT" -gt 0 ]]; then
              echo "::error::$(basename "$ZIP") contains both attestation.dex and attestation.apk"
              exit 1
            fi

            if [[ "$DEX_COUNT" -eq 1 && "$APK_COUNT" -eq 0 ]]; then
              echo "Validated $(basename "$ZIP"): attestation.dex"
            elif [[ "$APK_COUNT" -eq 1 && "$DEX_COUNT" -eq 0 ]]; then
              echo "Validated $(basename "$ZIP"): attestation.apk"
            else
              echo "::error::$(basename "$ZIP") contains duplicate attestation artifacts"
              exit 1
            fi
          done

          echo "releaseName=${RUN_NAME} Release" >> "$GITHUB_OUTPUT"
          echo "debugName=${RUN_NAME} Debug" >> "$GITHUB_OUTPUT"
          echo "releaseFile=$RELEASE_OUTPUT" >> "$GITHUB_OUTPUT"
          echo "debugFile=$DEBUG_OUTPUT" >> "$GITHUB_OUTPUT"

      - name: Upload release
        uses: actions/upload-artifact@v7
        with:
          name: ${{ steps.prepareArtifact.outputs.releaseName }}
          path: ${{ steps.prepareArtifact.outputs.releaseFile }}
          retention-days: 30
          archive: false

      - name: Upload debug
        uses: actions/upload-artifact@v7
        with:
          name: ${{ steps.prepareArtifact.outputs.debugName }}
          path: ${{ steps.prepareArtifact.outputs.debugFile }}
          retention-days: 7
          archive: false

      - name: Summary
        if: always()
        run: |
          echo "## Build Summary" >> "$GITHUB_STEP_SUMMARY"
          echo "- **Status**: ${{ job.status }}" >> "$GITHUB_STEP_SUMMARY"
          echo "- **Gradle Tasks**: assembleRelease, assembleDebug, lintRelease" >> "$GITHUB_STEP_SUMMARY"

          if [[ "${{ job.status }}" == "success" ]]; then
            echo "- **Release Artifact**: TrickyBox-${GITHUB_RUN_NUMBER} Release.zip" >> "$GITHUB_STEP_SUMMARY"
            echo "- **Debug Artifact**: TrickyBox-${GITHUB_RUN_NUMBER} Debug.zip" >> "$GITHUB_STEP_SUMMARY"
          fi
